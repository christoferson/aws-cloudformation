AWSTemplateFormatVersion: "2010-09-09"
Description: CodePipeline V2 - Dockerfile -> ECRBuildAndPublish -> InspectorScan (optional) -> digest-pinned ECS deploy (optional)

# -----------------------------------------------------------------------------
# Summary
#   Docker build, scan and deploy the V2 way. No AWS::CodeBuild::Project, no
#   buildspec, no `docker login` / `docker push` scripts:
#
#     git push -> Source   (CodeCommit, created by this stack)
#              -> Build    (ECRBuildAndPublish)  pushes :latest + :<commit sha>
#                                                 outputs ECRImageDigestId
#              -> Scan     (InspectorScan)        ImageScanEnabled=true
#                                                 fails above severity thresholds, outputs SBOM
#              -> Verify   (Commands)             writes imagedefinitions.json = repo@sha256:...
#              -> Deploy   (ECS standard action)  ContainerClusterName + ContainerServiceName set
#
#   V2-only features demonstrated (marked "[V2]" inline below):
#     - ECRBuildAndPublish build action (managed CodeBuild compute)
#     - Output variables ECRImageDigestId / ECRRepositoryName
#     - Commands action consuming them + producing a Files output artifact
#     - ExecutionMode QUEUED (every commit gets its own image, in order)
#   Also shown (managed compute, not documented as V2-only):
#     - InspectorScan ECRImageScan with severity thresholds + SBOM artifact
#
# Resources created
#   - AWS::CodeCommit::Repository     (Dockerfile goes in the repository root)
#   - AWS::ECR::Repository            (scan on push, lifecycle policy, emptied on delete)
#   - AWS::S3::Bucket                 (artifact store: source zip, SBOM, imagedefinitions.json)
#   - AWS::IAM::Role x2               (pipeline service role, EventBridge)
#   - AWS::Logs::LogGroup             (/aws/codepipeline/<pipeline-name>)
#   - AWS::CodePipeline::Pipeline
#   - AWS::Events::Rule               (CodeCommit push to branch -> pipeline)
#
# Pre-requisites
#   - None for build + scan. Push a Dockerfile to the repository root after deploy
#   - For the Deploy stage: an existing ECS cluster + service whose task
#     definition has a container named ContainerName (see ecs/ folder templates)
#
# Assumptions
#   - CodeCommit and ECR repository names are <Application>-<Environment>-app.
#     The CodeCommit repository is retained on stack delete (keeps your code);
#     delete it manually before re-creating a stack with the same name
#   - ImageTags / ImageTag use #{SourceVariables.CommitId}. Variables are allowed
#     in action configuration fields in general; the action references do not
#     mention it specifically. The scan relies on this commit tag
#   - imagedefinitions.json uses a digest URI (repo@sha256:...). The file
#     reference only shows repo:tag examples; a digest is a valid image
#     reference, so this pins the deploy to the exact image that was scanned
#   - Inspector: the only documented setup is IAM inspector-scan:ScanSbom (no
#     account activation step). Scans are billed by Inspector + CodeBuild
#   - Deploy uses iam:PassRole on * limited to ecs / ecs-tasks; scope it to your
#     task + execution role ARNs for production
#   - The first execution at stack creation fails at Source (empty repository)
# -----------------------------------------------------------------------------

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Application
        Parameters:
          - Application
          - Environment
      - Label:
          default: Source
        Parameters:
          - SourceBranchName
      - Label:
          default: Image Scan (Amazon Inspector)
        Parameters:
          - ImageScanEnabled
          - ImageScanCriticalThreshold
          - ImageScanHighThreshold
          - ImageScanMediumThreshold
          - ImageScanLowThreshold
      - Label:
          default: Deploy (Amazon ECS) - leave blank to skip
        Parameters:
          - ContainerClusterName
          - ContainerServiceName
          - ContainerName

Parameters:

  Application:
    Type: String
    Default: myapp
    Description: Application name used as a prefix for all resources

  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, stg, prod]
    Description: Deployment environment

  SourceBranchName:
    Type: String
    Default: main
    Description: Branch that starts the pipeline

  ImageScanEnabled:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Add a Scan stage (InspectorScan ECRImageScan) between Build and Verify

  ImageScanCriticalThreshold:
    Type: String
    Default: "0"
    AllowedPattern: "^$|^[0-9]+$"
    Description: Fail the scan when CRITICAL findings exceed this count. Blank = not checked

  ImageScanHighThreshold:
    Type: String
    Default: "0"
    AllowedPattern: "^$|^[0-9]+$"
    Description: Fail the scan when HIGH findings exceed this count. Blank = not checked

  ImageScanMediumThreshold:
    Type: String
    Default: ""
    AllowedPattern: "^$|^[0-9]+$"
    Description: Fail the scan when MEDIUM findings exceed this count. Blank = not checked

  ImageScanLowThreshold:
    Type: String
    Default: ""
    AllowedPattern: "^$|^[0-9]+$"
    Description: Fail the scan when LOW findings exceed this count. Blank = not checked

  ContainerClusterName:
    Type: String
    Default: ""
    Description: Existing ECS cluster name. Blank (or blank ContainerServiceName) = no Deploy stage

  ContainerServiceName:
    Type: String
    Default: ""
    Description: Existing ECS service name in ContainerClusterName. Blank = no Deploy stage

  ContainerName:
    Type: String
    Default: web
    Description: Container name in the ECS task definition (written to imagedefinitions.json)

Conditions:

  IsImageScanEnabled: !Equals [!Ref ImageScanEnabled, "true"]
  HasImageScanCriticalThreshold: !Not [!Equals [!Ref ImageScanCriticalThreshold, ""]]
  HasImageScanHighThreshold: !Not [!Equals [!Ref ImageScanHighThreshold, ""]]
  HasImageScanMediumThreshold: !Not [!Equals [!Ref ImageScanMediumThreshold, ""]]
  HasImageScanLowThreshold: !Not [!Equals [!Ref ImageScanLowThreshold, ""]]
  IsContainerDeployEnabled: !And
    - !Not [!Equals [!Ref ContainerClusterName, ""]]
    - !Not [!Equals [!Ref ContainerServiceName, ""]]

Resources:

  # ---------------------------------------------------------------
  # Source Repository + Container Image Repository + S3 Buckets
  # ---------------------------------------------------------------

  CodeCommitRepository:
    Type: AWS::CodeCommit::Repository
    DeletionPolicy: Retain # Keep code if the stack is deleted
    UpdateReplacePolicy: Retain
    Properties:
      RepositoryName: !Sub "${Application}-${Environment}-app"
      RepositoryDescription: CodePipeline V2 Docker build / scan / deploy demo - Dockerfile in the root
      Tags:
        - Key: Name
          Value: !Sub "${Application}-${Environment}-codecommit-repository"

  # [V2] ECRBuildAndPublish requires the repository to exist before it runs
  ContainerImageRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub "${Application}-${Environment}-app"
      ImageTagMutability: MUTABLE # "latest" moves on every build; deploys are pinned by digest
      ImageScanningConfiguration:
        ScanOnPush: true # ECR basic scan; InspectorScan below is the gate in the pipeline
      EncryptionConfiguration:
        EncryptionType: AES256
      EmptyOnDelete: true # Allows stack delete with images present
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Keep the 20 most recent images",
                "selection": {
                  "tagStatus": "any",
                  "countType": "imageCountMoreThan",
                  "countNumber": 20
                },
                "action": { "type": "expire" }
              }
            ]
          }
      Tags:
        - Key: Name
          Value: !Sub "${Application}-${Environment}-container-image-repository"

  ArtifactBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: expire-artifacts
            Status: Enabled
            ExpirationInDays: 30
      Tags:
        - Key: Name
          Value: !Sub "${Application}-${Environment}-pipeline-artifact-bucket"

  # ---------------------------------------------------------------
  # IAM Roles
  # ---------------------------------------------------------------

  # The pipeline role is the only compute role: ECRBuildAndPublish, InspectorScan
  # and the Commands action all run on managed CodeBuild compute as this role.
  PipelineServiceRole:
    Type: AWS::IAM::Role
    Properties:
      Description: CodePipeline V2 role - CodeCommit, artifacts, ECR push, Inspector scan, ECS deploy, logs
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: codepipeline.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: pipeline-service-policy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: CodeCommitSource
                Effect: Allow
                Action:
                  - codecommit:CancelUploadArchive
                  - codecommit:GetBranch
                  - codecommit:GetCommit
                  - codecommit:GetRepository
                  - codecommit:GetUploadArchiveStatus
                  - codecommit:UploadArchive
                Resource: !GetAtt CodeCommitRepository.Arn
              - Sid: ReadWriteArtifacts
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:PutObject
                  - s3:GetBucketVersioning
                  - s3:GetBucketLocation
                  - s3:ListBucket
                Resource:
                  - !GetAtt ArtifactBucket.Arn
                  - !Sub "${ArtifactBucket.Arn}/*"
              # [V2] ECRBuildAndPublish - account-level calls (no resource scoping possible)
              - Sid: EcrAuthorization
                Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                  - ecr:DescribeRepositories
                  - sts:GetServiceBearerToken
                Resource: "*"
              # [V2] ECRBuildAndPublish push + InspectorScan pull (GetDownloadUrlForLayer,
              # BatchGetImage, BatchCheckLayerAvailability) + Verify DescribeImages
              - Sid: EcrPushPullImage
                Effect: Allow
                Action:
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                  - ecr:PutImage
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchCheckLayerAvailability
                  - ecr:BatchGetImage
                  - ecr:DescribeImages
                Resource: !GetAtt ContainerImageRepository.Arn
              - !If
                - IsImageScanEnabled
                - Sid: InspectorScanSbom
                  Effect: Allow
                  Action: inspector-scan:ScanSbom
                  Resource: "*"
                - !Ref AWS::NoValue
              # ECS standard deploy action - minimum permissions per the action reference
              - !If
                - IsContainerDeployEnabled
                - Sid: ContainerTaskDefinition
                  Effect: Allow
                  Action:
                    - ecs:DescribeTaskDefinition
                    - ecs:RegisterTaskDefinition
                  Resource: "*"
                - !Ref AWS::NoValue
              - !If
                - IsContainerDeployEnabled
                - Sid: ContainerService
                  Effect: Allow
                  Action:
                    - ecs:DescribeServices
                    - ecs:UpdateService
                  Resource: !Sub "arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:service/${ContainerClusterName}/${ContainerServiceName}"
                - !Ref AWS::NoValue
              - !If
                - IsContainerDeployEnabled
                - Sid: ContainerTaskDefinitionTag
                  Effect: Allow
                  Action: ecs:TagResource
                  Resource: !Sub "arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:task-definition/*"
                  Condition:
                    StringEquals:
                      ecs:CreateAction: RegisterTaskDefinition
                - !Ref AWS::NoValue
              - !If
                - IsContainerDeployEnabled
                - Sid: ContainerTaskPassRole
                  Effect: Allow
                  Action: iam:PassRole
                  Resource: "*" # Scope to your task + execution role ARNs for production
                  Condition:
                    StringEquals:
                      iam:PassedToService:
                        - ecs.amazonaws.com
                        - ecs-tasks.amazonaws.com
                - !Ref AWS::NoValue
              - Sid: ManagedComputeLogs
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codepipeline/${Application}-${Environment}-docker-pipeline"
                  - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codepipeline/${Application}-${Environment}-docker-pipeline:*"
      Tags:
        - Key: Name
          Value: !Sub "${Application}-${Environment}-docker-pipeline-service-role"

  PipelineTriggerEventRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Allows EventBridge to start the pipeline
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: start-pipeline-execution
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: codepipeline:StartPipelineExecution
                Resource: !Sub "arn:${AWS::Partition}:codepipeline:${AWS::Region}:${AWS::AccountId}:${Pipeline}"
      Tags:
        - Key: Name
          Value: !Sub "${Application}-${Environment}-docker-pipeline-trigger-event-role"

  # ---------------------------------------------------------------
  # Log Groups
  # ---------------------------------------------------------------

  # Shared by ECRBuildAndPublish, InspectorScan and Commands (managed CodeBuild compute)
  PipelineManagedComputeLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub "/aws/codepipeline/${Application}-${Environment}-docker-pipeline"
      RetentionInDays: 7

  # ---------------------------------------------------------------
  # Pipeline
  # ---------------------------------------------------------------

  Pipeline:
    Type: AWS::CodePipeline::Pipeline
    DependsOn: PipelineManagedComputeLogGroup
    Properties:
      Name: !Sub "${Application}-${Environment}-docker-pipeline" # Fixed so the log group name is known
      RoleArn: !GetAtt PipelineServiceRole.Arn
      PipelineType: V2
      ExecutionMode: QUEUED # [V2] Every commit builds its own image, in order
      ArtifactStore:
        Type: S3
        Location: !Ref ArtifactBucket

      Stages:

        - Name: Source
          Actions:
            - Name: Source
              ActionTypeId:
                Category: Source
                Owner: AWS
                Provider: CodeCommit
                Version: "1"
              Namespace: SourceVariables
              Configuration:
                RepositoryName: !GetAtt CodeCommitRepository.Name
                BranchName: !Ref SourceBranchName
                PollForSourceChanges: false # Started by the EventBridge rule
              OutputArtifacts:
                - Name: SourceArtifact
              RunOrder: 1

        - Name: Build
          Actions:
            # [V2] Replaces CodeBuild project + buildspec with
            #   docker login / docker build / docker tag / docker push
            - Name: BuildAndPublishImage
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: ECRBuildAndPublish
                Version: "1"
              Namespace: BuildVariables # -> ECRImageDigestId, ECRRepositoryName
              Configuration:
                ECRRepositoryName: !Ref ContainerImageRepository
                # DockerFilePath omitted -> Dockerfile in the repository root
                ImageTags: "latest,#{SourceVariables.CommitId}" # Comma-delimited; default would be "latest"
                RegistryType: private
              InputArtifacts:
                - Name: SourceArtifact
              RunOrder: 1

        # Optional gate: scan the image just pushed (by its commit tag) before
        # imagedefinitions.json is produced, so a failing image is never deployed
        - !If
          - IsImageScanEnabled
          - Name: Scan
            Actions:
              - Name: ScanImage
                ActionTypeId:
                  Category: Invoke
                  Owner: AWS
                  Provider: InspectorScan
                  Version: "1"
                Namespace: ScanVariables # -> HighestScannedSeverity
                Configuration:
                  InspectorRunMode: ECRImageScan # or SourceCodeScan (input artifact = source)
                  ECRRepositoryName: !Ref ContainerImageRepository
                  ImageTag: "#{SourceVariables.CommitId}" # Takes a tag, not a digest
                  CriticalThreshold: !If [HasImageScanCriticalThreshold, !Ref ImageScanCriticalThreshold, !Ref AWS::NoValue]
                  HighThreshold: !If [HasImageScanHighThreshold, !Ref ImageScanHighThreshold, !Ref AWS::NoValue]
                  MediumThreshold: !If [HasImageScanMediumThreshold, !Ref ImageScanMediumThreshold, !Ref AWS::NoValue]
                  LowThreshold: !If [HasImageScanLowThreshold, !Ref ImageScanLowThreshold, !Ref AWS::NoValue]
                OutputArtifacts:
                  - Name: ImageSbomArtifact # SBOM with vulnerability details (kept in the artifact bucket)
                RunOrder: 1
          - !Ref AWS::NoValue

        - Name: Verify
          Actions:
            # [V2] Consume the digest: look the image up by digest and produce
            # imagedefinitions.json pinned to repo@sha256:... for the ECS deploy
            - Name: VerifyImage
              ActionTypeId:
                Category: Compute
                Owner: AWS
                Provider: Commands
                Version: "1"
              EnvironmentVariables:
                - Name: IMAGE_REGISTRY
                  Value: !Sub "${AWS::AccountId}.dkr.ecr.${AWS::Region}.${AWS::URLSuffix}"
                - Name: IMAGE_REPOSITORY
                  Value: "#{BuildVariables.ECRRepositoryName}"
                - Name: IMAGE_DIGEST
                  Value: "#{BuildVariables.ECRImageDigestId}"
                - Name: CONTAINER_NAME
                  Value: !Ref ContainerName
                - Name: HIGHEST_SCANNED_SEVERITY
                  Value: !If [IsImageScanEnabled, "#{ScanVariables.HighestScannedSeverity}", "scan-disabled"]
              Commands:
                # Docs say "the sha256 digest" without showing the format; ensure the sha256: prefix
                - "case \"$IMAGE_DIGEST\" in sha256:*) ;; *) IMAGE_DIGEST=\"sha256:$IMAGE_DIGEST\" ;; esac"
                - "echo Pushed $IMAGE_REGISTRY/$IMAGE_REPOSITORY@$IMAGE_DIGEST - highest scanned severity: $HIGHEST_SCANNED_SEVERITY"
                - "aws ecr describe-images --repository-name \"$IMAGE_REPOSITORY\" --image-ids imageDigest=\"$IMAGE_DIGEST\" --query \"imageDetails[0].{tags:imageTags,pushedAt:imagePushedAt,sizeBytes:imageSizeInBytes}\""
                - "printf '[{\"name\":\"%s\",\"imageUri\":\"%s\"}]' \"$CONTAINER_NAME\" \"$IMAGE_REGISTRY/$IMAGE_REPOSITORY@$IMAGE_DIGEST\" > imagedefinitions.json"
                - "cat imagedefinitions.json"
              InputArtifacts:
                - Name: SourceArtifact # Commands needs at least one input artifact
              OutputArtifacts:
                - Name: ImageDefinitionsArtifact
                  Files:
                    - imagedefinitions.json
              RunOrder: 1

        # Optional: ECS standard deploy (registers a new task definition revision
        # with the pinned image and updates the service)
        - !If
          - IsContainerDeployEnabled
          - Name: Deploy
            Actions:
              - Name: DeployToContainerService
                ActionTypeId:
                  Category: Deploy
                  Owner: AWS
                  Provider: ECS
                  Version: "1"
                Configuration:
                  ClusterName: !Ref ContainerClusterName
                  ServiceName: !Ref ContainerServiceName
                  FileName: imagedefinitions.json
                InputArtifacts:
                  - Name: ImageDefinitionsArtifact
                RunOrder: 1
          - !Ref AWS::NoValue

      Tags:
        - Key: Name
          Value: !Sub "${Application}-${Environment}-docker-pipeline"

  # ---------------------------------------------------------------
  # EventBridge Trigger (CodeCommit push -> pipeline)
  # ---------------------------------------------------------------

  PipelineTriggerEventRule:
    Type: AWS::Events::Rule
    Properties:
      Description: Start the docker pipeline on push to the source branch
      State: ENABLED
      EventPattern:
        source:
          - aws.codecommit
        detail-type:
          - CodeCommit Repository State Change
        resources:
          - !GetAtt CodeCommitRepository.Arn
        detail:
          event:
            - referenceCreated
            - referenceUpdated
          referenceType:
            - branch
          referenceName:
            - !Ref SourceBranchName
      Targets:
        - Id: docker-pipeline
          Arn: !Sub "arn:${AWS::Partition}:codepipeline:${AWS::Region}:${AWS::AccountId}:${Pipeline}"
          RoleArn: !GetAtt PipelineTriggerEventRole.Arn

Outputs:

  CodeCommitRepositoryName:
    Value: !GetAtt CodeCommitRepository.Name

  CodeCommitCloneUrlHttp:
    Value: !GetAtt CodeCommitRepository.CloneUrlHttp

  CodeCommitCloneUrlGrc:
    Description: git-remote-codecommit URL (pip install git-remote-codecommit)
    Value: !Sub "codecommit::${AWS::Region}://${CodeCommitRepository.Name}"

  ContainerImageRepositoryName:
    Value: !Ref ContainerImageRepository

  ContainerImageRepositoryUri:
    Value: !GetAtt ContainerImageRepository.RepositoryUri

  ContainerImageRepositoryArn:
    Value: !GetAtt ContainerImageRepository.Arn

  PipelineName:
    Value: !Ref Pipeline

  ArtifactBucketName:
    Value: !Ref ArtifactBucket

  PipelineManagedComputeLogGroupName:
    Description: ECRBuildAndPublish + InspectorScan + Commands logs
    Value: !Ref PipelineManagedComputeLogGroup
