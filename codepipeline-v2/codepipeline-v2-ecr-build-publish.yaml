AWSTemplateFormatVersion: "2010-09-09"
Description: CodePipeline V2 - Dockerfile -> ECRBuildAndPublish -> InspectorScan (optional) -> digest-pinned ECS deploy (optional)

# -----------------------------------------------------------------------------
# Summary
#   Docker build, scan and deploy the V2 way. No AWS::CodeBuild::Project, no
#   buildspec, no `docker login` / `docker push` scripts:
#
#     git push -> Source   (CodeCommit, created by this stack)
#              -> Build    (ECRBuildAndPublish)  pushes :latest + :<commit sha>
#                                                 outputs ECRImageDigestId
#              -> Scan     (InspectorScan)        ImageScanEnabled=true
#                                                 fails above severity thresholds, outputs SBOM
#              -> Verify   (Commands)             writes imagedefinitions.json = repo@sha256:...
#              -> Deploy   (ECS standard action)  ContainerClusterName + ContainerServiceName set
#                          (+ Bake, Commands)      DeployBakeTimeInMinutes > 0
#                 On Success: CloudWatchAlarm rule  DeployRollbackAlarmName set
#                             alarm in ALARM -> ROLLBACK to the last good deploy
#
#   V2-only features demonstrated (marked "[V2]" inline below):
#     - ECRBuildAndPublish build action (managed CodeBuild compute)
#     - Output variables ECRImageDigestId / ECRRepositoryName
#     - Commands action consuming them + producing a Files output artifact
#     - ExecutionMode QUEUED (every commit gets its own image, in order)
#     - Stage condition OnSuccess + CloudWatchAlarm rule + ROLLBACK result
#   Also shown (managed compute, not documented as V2-only):
#     - InspectorScan ECRImageScan with severity thresholds + SBOM artifact
#
# Resources created
#   - AWS::CodeCommit::Repository     (Dockerfile goes in the repository root)
#   - AWS::ECR::Repository            (scan on push, lifecycle policy, emptied on delete)
#   - AWS::S3::Bucket                 (artifact store: source zip, SBOM, imagedefinitions.json)
#   - AWS::IAM::Role x2               (pipeline service role, EventBridge)
#   - AWS::Logs::LogGroup             (/aws/codepipeline/<pipeline-name>)
#   - AWS::CodePipeline::Pipeline
#   - AWS::Events::Rule               (CodeCommit push to branch -> pipeline)
#
# Pre-requisites
#   - None for build + scan. Push a Dockerfile to the repository root after deploy
#   - For the Deploy stage: an existing ECS cluster + service whose task
#     definition has a container named ContainerName (see ecs/ folder templates)
#
# Assumptions
#   - CodeCommit and ECR repository names are <Application>-<Environment>-app.
#     The CodeCommit repository is retained on stack delete (keeps your code);
#     delete it manually before re-creating a stack with the same name
#   - ImageTags / ImageTag use #{SourceVariables.CommitId}. Variables are allowed
#     in action configuration fields in general; the action references do not
#     mention it specifically. The scan relies on this commit tag
#   - imagedefinitions.json uses a digest URI (repo@sha256:...). The file
#     reference only shows repo:tag examples; a digest is a valid image
#     reference, so this pins the deploy to the exact image that was scanned
#   - Inspector: the only documented setup is IAM inspector-scan:ScanSbom (no
#     account activation step). Scans are billed by Inspector + CodeBuild
#   - Deploy uses iam:PassRole on * limited to ecs / ecs-tasks; scope it to your
#     task + execution role ARNs for production
#   - The first execution at stack creation fails at Source (empty repository)
#   - Rollback needs a previous execution that succeeded in the Deploy stage in
#     the current pipeline structure version (none on the very first deploy, or
#     right after a pipeline update). Not available with ExecutionMode PARALLEL
#   - The CloudWatchAlarm rule succeeds immediately if the alarm is OK when first
#     checked; WaitTime only applies when it is already in ALARM. Use the bake
#     step so the alarm can react to new traffic first. The rollback alarm must
#     already exist (e.g. ALB HTTPCode_Target_5XX_Count) - see README
# -----------------------------------------------------------------------------

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Application
        Parameters:
          - Application
          - Environment
      - Label:
          default: Source
        Parameters:
          - SourceBranchName
      - Label:
          default: Image Scan (Amazon Inspector)
        Parameters:
          - ImageScanEnabled
          - ImageScanCriticalThreshold
          - ImageScanHighThreshold
          - ImageScanMediumThreshold
          - ImageScanLowThreshold
      - Label:
          default: Deploy (Amazon ECS) - leave blank to skip
        Parameters:
          - ContainerClusterName
          - ContainerServiceName
          - ContainerName
      - Label:
          default: Post-deploy health check (On Success condition) - needs Deploy
        Parameters:
          - DeployRollbackAlarmName
          - DeployRollbackAlarmWaitTimeInMinutes
          - DeployBakeTimeInMinutes

Parameters:

  Application:
    Type: String
    Default: myapp
    Description: Application name used as a prefix for all resources

  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, stg, prod]
    Description: Deployment environment

  SourceBranchName:
    Type: String
    Default: main
    Description: Branch that starts the pipeline

  ImageScanEnabled:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Add a Scan stage (InspectorScan ECRImageScan) between Build and Verify

  ImageScanCriticalThreshold:
    Type: String
    Default: "0"
    AllowedPattern: "^$|^[0-9]+$"
    Description: Fail the scan when CRITICAL findings exceed this count. Blank = not checked

  ImageScanHighThreshold:
    Type: String
    Default: "0"
    AllowedPattern: "^$|^[0-9]+$"
    Description: Fail the scan when HIGH findings exceed this count. Blank = not checked

  ImageScanMediumThreshold:
    Type: String
    Default: ""
    AllowedPattern: "^$|^[0-9]+$"
    Description: Fail the scan when MEDIUM findings exceed this count. Blank = not checked

  ImageScanLowThreshold:
    Type: String
    Default: ""
    AllowedPattern: "^$|^[0-9]+$"
    Description: Fail the scan when LOW findings exceed this count. Blank = not checked

  ContainerClusterName:
    Type: String
    Default: ""
    Description: Existing ECS cluster name. Blank (or blank ContainerServiceName) = no Deploy stage

  ContainerServiceName:
    Type: String
    Default: ""
    Description: Existing ECS service name in ContainerClusterName. Blank = no Deploy stage

  ContainerName:
    Type: String
    Default: web
    Description: Container name in the ECS task definition (written to imagedefinitions.json)

  DeployRollbackAlarmName:
    Type: String
    Default: ""
    Description: "[V2] Existing CloudWatch alarm (e.g. error rate). If in ALARM after Deploy succeeds, roll production back. Blank = no On Success condition"

  DeployRollbackAlarmWaitTimeInMinutes:
    Type: String
    Default: "1"
    AllowedPattern: "^$|^[0-9]+$"
    Description: "[V2] CloudWatchAlarm rule WaitTime - minutes to wait for an alarm already in ALARM to recover before rolling back. Blank = rule default"

  DeployBakeTimeInMinutes:
    Type: Number
    Default: 5
    MinValue: 0
    MaxValue: 50
    Description: Minutes to wait after the ECS deploy (Commands action) so the alarm sees new traffic before the On Success check. 0 = no bake

Conditions:

  IsImageScanEnabled: !Equals [!Ref ImageScanEnabled, "true"]
  HasImageScanCriticalThreshold: !Not [!Equals [!Ref ImageScanCriticalThreshold, ""]]
  HasImageScanHighThreshold: !Not [!Equals [!Ref ImageScanHighThreshold, ""]]
  HasImageScanMediumThreshold: !Not [!Equals [!Ref ImageScanMediumThreshold, ""]]
  HasImageScanLowThreshold: !Not [!Equals [!Ref ImageScanLowThreshold, ""]]
  IsContainerDeployEnabled: !And
    - !Not [!Equals [!Ref ContainerClusterName, ""]]
    - !Not [!Equals [!Ref ContainerServiceName, ""]]
  IsDeployRollbackEnabled: !And
    - !Condition IsContainerDeployEnabled
    - !Not [!Equals [!Ref DeployRollbackAlarmName, ""]]
  HasDeployRollbackAlarmWaitTime: !Not [!Equals [!Ref DeployRollbackAlarmWaitTimeInMinutes, ""]]
  IsDeployBakeEnabled: !And
    - !Condition IsContainerDeployEnabled
    - !Not [!Equals [!Ref DeployBakeTimeInMinutes, "0"]]

Resources:

  # ---------------------------------------------------------------
  # Source Repository + Container Image Repository + S3 Buckets
  # ---------------------------------------------------------------

  CodeCommitRepository:
    Type: AWS::CodeCommit::Repository
    DeletionPolicy: Retain # Keep code if the stack is deleted
    UpdateReplacePolicy: Retain
    Properties:
      RepositoryName: !Sub "${Application}-${Environment}-app"
      RepositoryDescription: CodePipeline V2 Docker build / scan / deploy demo - Dockerfile in the root
      Tags:
        - Key: Name
          Value: !Sub "${Application}-${Environment}-codecommit-repository"

  # [V2] ECRBuildAndPublish requires the repository to exist before it runs
  ContainerImageRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub "${Application}-${Environment}-app"
      ImageTagMutability: MUTABLE # "latest" moves on every build; deploys are pinned by digest
      ImageScanningConfiguration:
        ScanOnPush: true # ECR basic scan; InspectorScan below is the gate in the pipeline
      EncryptionConfiguration:
        EncryptionType: AES256
      EmptyOnDelete: true # Allows stack delete with images present
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Keep the 20 most recent images",
                "selection": {
                  "tagStatus": "any",
                  "countType": "imageCountMoreThan",
                  "countNumber": 20
                },
                "action": { "type": "expire" }
              }
            ]
          }
      Tags:
        - Key: Name
          Value: !Sub "${Application}-${Environment}-container-image-repository"

  ArtifactBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: expire-artifacts
            Status: Enabled
            ExpirationInDays: 30
      Tags:
        - Key: Name
          Value: !Sub "${Application}-${Environment}-pipeline-artifact-bucket"

  # ---------------------------------------------------------------
  # IAM Roles
  # ---------------------------------------------------------------

  # The pipeline role is the only compute role: ECRBuildAndPublish, InspectorScan
  # and the Commands action all run on managed CodeBuild compute as this role.
  PipelineServiceRole:
    Type: AWS::IAM::Role
    Properties:
      Description: CodePipeline V2 role - CodeCommit, artifacts, ECR push, Inspector scan, ECS deploy, logs
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: codepipeline.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: pipeline-service-policy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: CodeCommitSource
                Effect: Allow
                Action:
                  - codecommit:CancelUploadArchive
                  - codecommit:GetBranch
                  - codecommit:GetCommit
                  - codecommit:GetRepository
                  - codecommit:GetUploadArchiveStatus
                  - codecommit:UploadArchive
                Resource: !GetAtt CodeCommitRepository.Arn
              - Sid: ReadWriteArtifacts
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:PutObject
                  - s3:GetBucketVersioning
                  - s3:GetBucketLocation
                  - s3:ListBucket
                Resource:
                  - !GetAtt ArtifactBucket.Arn
                  - !Sub "${ArtifactBucket.Arn}/*"
              # [V2] ECRBuildAndPublish - account-level calls (no resource scoping possible)
              - Sid: EcrAuthorization
                Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                  - ecr:DescribeRepositories
                  - sts:GetServiceBearerToken
                Resource: "*"
              # [V2] ECRBuildAndPublish push + InspectorScan pull (GetDownloadUrlForLayer,
              # BatchGetImage, BatchCheckLayerAvailability) + Verify DescribeImages
              - Sid: EcrPushPullImage
                Effect: Allow
                Action:
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                  - ecr:PutImage
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchCheckLayerAvailability
                  - ecr:BatchGetImage
                  - ecr:DescribeImages
                Resource: !GetAtt ContainerImageRepository.Arn
              - !If
                - IsImageScanEnabled
                - Sid: InspectorScanSbom
                  Effect: Allow
                  Action: inspector-scan:ScanSbom
                  Resource: "*"
                - !Ref AWS::NoValue
              # ECS standard deploy action - minimum permissions per the action reference
              - !If
                - IsContainerDeployEnabled
                - Sid: ContainerTaskDefinition
                  Effect: Allow
                  Action:
                    - ecs:DescribeTaskDefinition
                    - ecs:RegisterTaskDefinition
                  Resource: "*"
                - !Ref AWS::NoValue
              - !If
                - IsContainerDeployEnabled
                - Sid: ContainerService
                  Effect: Allow
                  Action:
                    - ecs:DescribeServices
                    - ecs:UpdateService
                  Resource: !Sub "arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:service/${ContainerClusterName}/${ContainerServiceName}"
                - !Ref AWS::NoValue
              - !If
                - IsContainerDeployEnabled
                - Sid: ContainerTaskDefinitionTag
                  Effect: Allow
                  Action: ecs:TagResource
                  Resource: !Sub "arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:task-definition/*"
                  Condition:
                    StringEquals:
                      ecs:CreateAction: RegisterTaskDefinition
                - !Ref AWS::NoValue
              - !If
                - IsContainerDeployEnabled
                - Sid: ContainerTaskPassRole
                  Effect: Allow
                  Action: iam:PassRole
                  Resource: "*" # Scope to your task + execution role ARNs for production
                  Condition:
                    StringEquals:
                      iam:PassedToService:
                        - ecs.amazonaws.com
                        - ecs-tasks.amazonaws.com
                - !Ref AWS::NoValue
              # [V2] CloudWatchAlarm rule (runs as the pipeline role - RuleDeclaration
              # RoleArn not set) + the bake step printing the alarm state.
              # The rule reference does not list permissions; DescribeAlarms is inferred.
              - !If
                - IsDeployRollbackEnabled
                - Sid: DeployRollbackAlarmRead
                  Effect: Allow
                  Action: cloudwatch:DescribeAlarms
                  Resource: !Sub "arn:${AWS::Partition}:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:${DeployRollbackAlarmName}"
                - !Ref AWS::NoValue
              - Sid: ManagedComputeLogs
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codepipeline/${Application}-${Environment}-docker-pipeline"
                  - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codepipeline/${Application}-${Environment}-docker-pipeline:*"
      Tags:
        - Key: Name
          Value: !Sub "${Application}-${Environment}-docker-pipeline-service-role"

  PipelineTriggerEventRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Allows EventBridge to start the pipeline
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: start-pipeline-execution
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: codepipeline:StartPipelineExecution
                Resource: !Sub "arn:${AWS::Partition}:codepipeline:${AWS::Region}:${AWS::AccountId}:${Pipeline}"
      Tags:
        - Key: Name
          Value: !Sub "${Application}-${Environment}-docker-pipeline-trigger-event-role"

  # ---------------------------------------------------------------
  # Log Groups
  # ---------------------------------------------------------------

  # Shared by ECRBuildAndPublish, InspectorScan and Commands (managed CodeBuild compute)
  PipelineManagedComputeLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub "/aws/codepipeline/${Application}-${Environment}-docker-pipeline"
      RetentionInDays: 7

  # ---------------------------------------------------------------
  # Pipeline
  # ---------------------------------------------------------------

  # STUDY NOTES - how to read a pipeline definition
  #   Pipeline -> Stages (run top to bottom, one at a time)
  #            -> Actions (inside a stage, ordered by RunOrder)
  #   Actions pass FILES to each other as artifacts (zips in the artifact
  #   bucket: OutputArtifacts of one action = InputArtifacts of a later one)
  #   and pass VALUES as variables (#{Namespace.Key}).
  #
  #   ActionTypeId = which action this is, identified by four fields together:
  #     Category  the kind of step. Valid: Source | Build | Test | Deploy |
  #               Approval | Invoke | Compute. Each category allows only
  #               certain providers (CodeCommit is a Source, ECS is a Deploy)
  #     Owner     who implements it: AWS (built in), ThirdParty, or Custom
  #               (your own job worker). Everything in this template is AWS
  #     Provider  the service/action that does the work (CodeCommit, ECS, ...)
  #     Version   the version of the ACTION TYPE. Every AWS-owned action
  #               reference in docs/codepipeline/ documents version "1" - it is
  #               not something you bump. It is NOT the pipeline's version:
  #               that one auto-increments on every pipeline update
  #               (!GetAtt Pipeline.Version) and is used by rollback.
  #               Written as a string ("1") like the AWS examples.
  #   Docs: docs/codepipeline/ug-action-requirements.md

  Pipeline:
    Type: AWS::CodePipeline::Pipeline
    DependsOn: PipelineManagedComputeLogGroup
    Properties:
      # Changing Name REPLACES the pipeline (new pipeline, history lost).
      Name: !Sub "${Application}-${Environment}-docker-pipeline" # Fixed so the log group name is known
      # Role CodePipeline assumes to run every action that has no action-level
      # RoleArn. Managed compute actions (ECRBuildAndPublish, InspectorScan,
      # Commands) also run their commands with this role.
      RoleArn: !GetAtt PipelineServiceRole.Arn
      PipelineType: V2          # V1 | V2. Updating V1 -> V2 is in place (no replacement)
      ExecutionMode: QUEUED     # [V2] SUPERSEDED (default) | QUEUED | PARALLEL. Every commit builds its own image, in order
      # Where artifacts are stored between actions. One bucket per Region;
      # use ArtifactStores (plural, per Region) for cross-Region actions.
      ArtifactStore:
        Type: S3
        Location: !Ref ArtifactBucket

      Stages:

        - Name: Source        # Stage names must be unique in the pipeline
          Actions:
            - Name: Source    # Action names must be unique within the stage
              ActionTypeId:
                Category: Source      # Every pipeline needs a Source action; it has no input artifacts
                Owner: AWS
                Provider: CodeCommit  # Other Source providers: S3, ECR, CodeStarSourceConnection (GitHub/GitLab/Bitbucket)
                Version: "1"          # Action type version - see STUDY NOTES above
              # Namespace makes this action's output variables referenceable as
              # #{SourceVariables.<key>}. CodeCommit outputs: CommitId, BranchName,
              # RepositoryName, CommitMessage, AuthorDate, CommitterDate.
              # Without a namespace the variables exist but cannot be referenced.
              # Must be unique in the pipeline and not clash with an artifact name.
              Namespace: SourceVariables
              # Configuration keys are defined by the Provider (see the action
              # reference: docs/codepipeline/ug-action-reference-codecommit.md)
              Configuration:
                RepositoryName: !GetAtt CodeCommitRepository.Name
                BranchName: !Ref SourceBranchName
                # Omitted = true = CodePipeline polls the repo. Set false when an
                # EventBridge rule starts the pipeline, or every push runs twice.
                PollForSourceChanges: false # Started by the EventBridge rule
              # The repo contents at that commit, zipped (CODE_ZIP, the default).
              # Artifact names must be unique in the pipeline.
              OutputArtifacts:
                - Name: SourceArtifact
              # Order within the stage: same number = run in parallel, higher = later.
              # Default 1; gaps are fine (1, 3 runs 3 after 1).
              RunOrder: 1

        - Name: Build
          Actions:
            # [V2] Replaces CodeBuild project + buildspec with
            #   docker login / docker build / docker tag / docker push
            - Name: BuildAndPublishImage
              ActionTypeId:
                Category: Build              # Build category: CodeBuild, ECRBuildAndPublish, ...
                Owner: AWS
                Provider: ECRBuildAndPublish # V2-only managed compute action
                Version: "1"
              Namespace: BuildVariables # -> ECRImageDigestId, ECRRepositoryName
              Configuration:
                ECRRepositoryName: !Ref ContainerImageRepository # Repository must already exist
                # DockerFilePath omitted -> Dockerfile in the repository root
                # A variable from an EARLIER action: the referencing action must be
                # in a later stage, or the same stage with a higher RunOrder.
                ImageTags: "latest,#{SourceVariables.CommitId}" # Comma-delimited; default would be "latest"
                RegistryType: private # private (default) | public
              # Must exactly match an OutputArtifacts name from a preceding action
              InputArtifacts:
                - Name: SourceArtifact
              # No OutputArtifacts: this action outputs variables, not files
              RunOrder: 1

        # Optional gate: scan the image just pushed (by its commit tag) before
        # imagedefinitions.json is produced, so a failing image is never deployed
        - !If
          - IsImageScanEnabled
          - Name: Scan
            Actions:
              - Name: ScanImage
                ActionTypeId:
                  Category: Invoke        # Invoke category: actions that call another service (InspectorScan, Lambda, StepFunctions, CodePipeline)
                  Owner: AWS
                  Provider: InspectorScan # Managed compute; documented without a V2-only note
                  Version: "1"
                Namespace: ScanVariables # -> HighestScannedSeverity
                Configuration:
                  InspectorRunMode: ECRImageScan # or SourceCodeScan (input artifact = source)
                  ECRRepositoryName: !Ref ContainerImageRepository
                  ImageTag: "#{SourceVariables.CommitId}" # Takes a tag, not a digest
                  CriticalThreshold: !If [HasImageScanCriticalThreshold, !Ref ImageScanCriticalThreshold, !Ref AWS::NoValue]
                  HighThreshold: !If [HasImageScanHighThreshold, !Ref ImageScanHighThreshold, !Ref AWS::NoValue]
                  MediumThreshold: !If [HasImageScanMediumThreshold, !Ref ImageScanMediumThreshold, !Ref AWS::NoValue]
                  LowThreshold: !If [HasImageScanLowThreshold, !Ref ImageScanLowThreshold, !Ref AWS::NoValue]
                OutputArtifacts:
                  - Name: ImageSbomArtifact # SBOM with vulnerability details (kept in the artifact bucket)
                RunOrder: 1
          - !Ref AWS::NoValue

        - Name: Verify
          Actions:
            # [V2] Consume the digest: look the image up by digest and produce
            # imagedefinitions.json pinned to repo@sha256:... for the ECS deploy
            - Name: VerifyImage
              ActionTypeId:
                Category: Compute   # Compute category: run your own commands (V2)
                Owner: AWS
                Provider: Commands  # V2-only. Commands/EnvironmentVariables/OutputVariables
                Version: "1"        # sit on the action itself, not under Configuration
              # Plain env vars for the shell. Values may be literals, !Ref/!Sub
              # (resolved by CloudFormation at deploy time) or #{...} variables
              # (resolved by CodePipeline at run time).
              EnvironmentVariables:
                - Name: IMAGE_REGISTRY
                  Value: !Sub "${AWS::AccountId}.dkr.ecr.${AWS::Region}.${AWS::URLSuffix}"
                - Name: IMAGE_REPOSITORY
                  Value: "#{BuildVariables.ECRRepositoryName}"
                - Name: IMAGE_DIGEST
                  Value: "#{BuildVariables.ECRImageDigestId}"
                - Name: CONTAINER_NAME
                  Value: !Ref ContainerName
                - Name: HIGHEST_SCANNED_SEVERITY
                  Value: !If [IsImageScanEnabled, "#{ScanVariables.HighestScannedSeverity}", "scan-disabled"]
              Commands:
                # Docs say "the sha256 digest" without showing the format; ensure the sha256: prefix
                - "case \"$IMAGE_DIGEST\" in sha256:*) ;; *) IMAGE_DIGEST=\"sha256:$IMAGE_DIGEST\" ;; esac"
                - "echo Pushed $IMAGE_REGISTRY/$IMAGE_REPOSITORY@$IMAGE_DIGEST - highest scanned severity: $HIGHEST_SCANNED_SEVERITY"
                - "aws ecr describe-images --repository-name \"$IMAGE_REPOSITORY\" --image-ids imageDigest=\"$IMAGE_DIGEST\" --query \"imageDetails[0].{tags:imageTags,pushedAt:imagePushedAt,sizeBytes:imageSizeInBytes}\""
                - "printf '[{\"name\":\"%s\",\"imageUri\":\"%s\"}]' \"$CONTAINER_NAME\" \"$IMAGE_REGISTRY/$IMAGE_REPOSITORY@$IMAGE_DIGEST\" > imagedefinitions.json"
                - "cat imagedefinitions.json"
              InputArtifacts:
                - Name: SourceArtifact # Commands needs at least one input artifact
              OutputArtifacts:
                - Name: ImageDefinitionsArtifact
                  Files:            # Commands only: which files from the workspace go into the artifact
                    - imagedefinitions.json
              RunOrder: 1

        # Optional: ECS standard deploy (registers a new task definition revision
        # with the pinned image and updates the service)
        - !If
          - IsContainerDeployEnabled
          - Name: Deploy
            Actions:
              - Name: DeployToContainerService
                ActionTypeId:
                  Category: Deploy   # Deploy actions have no output artifacts
                  Owner: AWS
                  Provider: ECS      # "ECS standard": updates the service; the service's own deployment config decides how it rolls out. V1 and V2
                  Version: "1"
                Configuration:
                  ClusterName: !Ref ContainerClusterName
                  ServiceName: !Ref ContainerServiceName
                  FileName: imagedefinitions.json # Default name; read from the input artifact
                InputArtifacts:
                  - Name: ImageDefinitionsArtifact
                RunOrder: 1          # Bake below has RunOrder 2, so it runs after the deploy
              # Bake: "deploy action succeeded" != "release is healthy". Give the
              # alarm time to see real traffic on the new version before the
              # On Success check below runs (the rule itself does not watch over time
              # when the alarm is OK - see README).
              - !If
                - IsDeployBakeEnabled
                - Name: BakeAndWatchAlarm
                  ActionTypeId:
                    Category: Compute
                    Owner: AWS
                    Provider: Commands
                    Version: "1"
                  EnvironmentVariables:
                    - Name: BAKE_MINUTES
                      Value: !Ref DeployBakeTimeInMinutes
                    - Name: ALARM_NAME
                      Value: !If [IsDeployRollbackEnabled, !Ref DeployRollbackAlarmName, "none"]
                  Commands:
                    - "echo \"Baking for $BAKE_MINUTES minute(s), watching alarm $ALARM_NAME\""
                    - "for i in $(seq 1 $BAKE_MINUTES); do sleep 60; if [ \"$ALARM_NAME\" != none ]; then echo minute $i: $(aws cloudwatch describe-alarms --alarm-names \"$ALARM_NAME\" --query 'MetricAlarms[0].StateValue' --output text); else echo minute $i; fi; done"
                  InputArtifacts:
                    - Name: ImageDefinitionsArtifact # Commands needs at least one input artifact
                  RunOrder: 2
                - !Ref AWS::NoValue
            # [V2] On Success condition: the stage succeeded, now check health.
            # Alarm in ALARM -> rule fails -> ROLLBACK: CodePipeline starts a new
            # execution of type "rollback" that re-runs this stage with the artifacts
            # (previous imagedefinitions.json = previous digest) and variables of the
            # last execution that succeeded in this stage.
            OnSuccess: !If
              - IsDeployRollbackEnabled
              - Conditions:
                  - Result: ROLLBACK # On Success allows ROLLBACK or FAIL
                    Rules:           # Up to 5; if ANY rule fails, Result is applied
                      - Name: ErrorRateAlarm
                        # Rules mirror ActionTypeId: same four fields, but the
                        # Category is always "Rule" and Provider is the rule type
                        # (CloudWatchAlarm, DeploymentWindow, VariableCheck,
                        # LambdaInvoke, Commands, CodeBuild). Version "1" again.
                        RuleTypeId:
                          Category: Rule
                          Owner: AWS
                          Provider: CloudWatchAlarm
                          Version: "1"
                        Configuration:
                          AlarmName: !Ref DeployRollbackAlarmName
                          WaitTime: !If [HasDeployRollbackAlarmWaitTime, !Ref DeployRollbackAlarmWaitTimeInMinutes, !Ref AWS::NoValue]
              - !Ref AWS::NoValue
          - !Ref AWS::NoValue

      Tags:
        - Key: Name
          Value: !Sub "${Application}-${Environment}-docker-pipeline"

  # ---------------------------------------------------------------
  # EventBridge Trigger (CodeCommit push -> pipeline)
  # ---------------------------------------------------------------

  PipelineTriggerEventRule:
    Type: AWS::Events::Rule
    Properties:
      Description: Start the docker pipeline on push to the source branch
      State: ENABLED
      EventPattern:
        source:
          - aws.codecommit
        detail-type:
          - CodeCommit Repository State Change
        resources:
          - !GetAtt CodeCommitRepository.Arn
        detail:
          event:
            - referenceCreated
            - referenceUpdated
          referenceType:
            - branch
          referenceName:
            - !Ref SourceBranchName
      Targets:
        - Id: docker-pipeline
          Arn: !Sub "arn:${AWS::Partition}:codepipeline:${AWS::Region}:${AWS::AccountId}:${Pipeline}"
          RoleArn: !GetAtt PipelineTriggerEventRole.Arn

Outputs:

  CodeCommitRepositoryName:
    Value: !GetAtt CodeCommitRepository.Name

  CodeCommitCloneUrlHttp:
    Value: !GetAtt CodeCommitRepository.CloneUrlHttp

  CodeCommitCloneUrlGrc:
    Description: git-remote-codecommit URL (pip install git-remote-codecommit)
    Value: !Sub "codecommit::${AWS::Region}://${CodeCommitRepository.Name}"

  ContainerImageRepositoryName:
    Value: !Ref ContainerImageRepository

  ContainerImageRepositoryUri:
    Value: !GetAtt ContainerImageRepository.RepositoryUri

  ContainerImageRepositoryArn:
    Value: !GetAtt ContainerImageRepository.Arn

  PipelineName:
    Value: !Ref Pipeline

  ArtifactBucketName:
    Value: !Ref ArtifactBucket

  PipelineManagedComputeLogGroupName:
    Description: ECRBuildAndPublish + InspectorScan + Commands logs
    Value: !Ref PipelineManagedComputeLogGroup
