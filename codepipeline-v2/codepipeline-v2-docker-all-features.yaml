AWSTemplateFormatVersion: "2010-09-09"
Description: CodePipeline V2 - all features - variables, retry, Inspector scan + SKIP, digest-pinned ECS deploy, deployment window, alarm rollback

# -----------------------------------------------------------------------------
# Summary
#   One pipeline using every feature from the single-feature templates:
#     git push -> Source  (CodeCommit)
#              -> Build   (ECRBuildAndPublish, tags #{variables.ImageTag} + commit SHA)
#                         OnFailure: automatic RETRY (one attempt)
#              -> Scan    (InspectorScan, severity thresholds, SBOM)
#                         Entry: VariableCheck #{variables.RunImageScan} EQ true, else SKIP
#              -> Verify  (Commands: imagedefinitions.json = repo@sha256:<digest>)
#              -> Deploy  (ECS + Bake)
#                         Entry: DeploymentWindow, else FAIL
#                         On Success: CloudWatchAlarm in ALARM -> ROLLBACK
#   Single-feature versions: codepipeline-v2-feature-*.yaml. PARALLEL mode and Git
#   triggers are not here (PARALLEL rules out ROLLBACK; triggers need a
#   CodeConnections source) - see codepipeline-v2-feature-git-triggers.yaml.
#
# Resources created
#   - AWS::CodeCommit::Repository     (Dockerfile in the repository root)
#   - AWS::ECR::Repository
#   - AWS::S3::Bucket                 (artifact store: source, SBOM, imagedefinitions.json)
#   - AWS::IAM::Role x2               (pipeline service role, EventBridge)
#   - AWS::Logs::LogGroup             (/aws/codepipeline/<pipeline-name>)
#   - AWS::CodePipeline::Pipeline
#   - AWS::Events::Rule               (CodeCommit push to branch -> pipeline)
#
# Pre-requisites
#   - An ECS cluster + service whose task definition has a container named
#     ContainerName
#   - A CloudWatch alarm for the service's errors (e.g. ALB
#     HTTPCode_Target_5XX_Count), named DeployRollbackAlarmName
#
# Assumptions
#   - CodeCommit and ECR repositories are named <Application>-<Environment>-all-features
#   - Pipeline variable values must match [A-Za-z0-9@\-_]+ (no dots)
#   - ImageTags / ImageTag use #{...} variables: allowed in action configuration
#     fields in general; the action references do not mention it specifically.
#     Scan finds the image by its commit tag (ImageTag takes a tag, not a digest)
#   - imagedefinitions.json uses a digest URI (repo@sha256:...); the file
#     reference only shows repo:tag examples
#   - DeploymentWindow: outside the window the rule fails and the FAIL result is
#     applied; the docs do not describe it waiting for the window
#   - CloudWatchAlarm on On Success: OK / INSUFFICIENT_DATA pass, ALARM fails. If
#     OK when first checked it passes at once (WaitTime only applies when already
#     in ALARM), hence the Bake step
#   - Rollback needs a previous execution that succeeded in the Deploy stage in the
#     current pipeline structure version
#   - The only documented Inspector setup is IAM inspector-scan:ScanSbom.
#     cloudwatch:DescribeAlarms for the rule is inferred (rule reference lists none)
#   - iam:PassRole is on * limited to ecs / ecs-tasks; scope it for production
#   - The first execution at stack creation fails at Source (empty repository)
# -----------------------------------------------------------------------------

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Application
        Parameters:
          - Application
          - Environment
      - Label:
          default: Source
        Parameters:
          - SourceBranchName
      - Label:
          default: Pipeline variable defaults
        Parameters:
          - ImageTagDefault
      - Label:
          default: Image Scan (Amazon Inspector)
        Parameters:
          - ImageScanCriticalThreshold
          - ImageScanHighThreshold
          - ImageScanMediumThreshold
          - ImageScanLowThreshold
      - Label:
          default: Deploy (Amazon ECS)
        Parameters:
          - ContainerClusterName
          - ContainerServiceName
          - ContainerName
      - Label:
          default: Deployment window
        Parameters:
          - DeploymentWindowCron
          - DeploymentWindowTimeZone
      - Label:
          default: Post-deploy health check
        Parameters:
          - DeployRollbackAlarmName
          - DeployRollbackAlarmWaitTimeInMinutes
          - DeployBakeTimeInMinutes

Parameters:

  Application:
    Type: String
    Default: myapp
    Description: Application name used as a prefix for all resources

  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, stg, prod]
    Description: Deployment environment

  SourceBranchName:
    Type: String
    Default: main
    Description: Branch that starts the pipeline

  ImageTagDefault:
    Type: String
    Default: latest
    AllowedPattern: "[A-Za-z0-9@\\-_]+"
    Description: Default for the ImageTag pipeline variable (used by triggered runs)

  ImageScanCriticalThreshold:
    Type: String
    Default: "0"
    AllowedPattern: "^[0-9]+$"
    Description: Fail the scan when CRITICAL findings exceed this count (0 = fail on any)

  ImageScanHighThreshold:
    Type: String
    Default: "0"
    AllowedPattern: "^[0-9]+$"
    Description: Fail the scan when HIGH findings exceed this count

  ImageScanMediumThreshold:
    Type: String
    Default: "10"
    AllowedPattern: "^[0-9]+$"
    Description: Fail the scan when MEDIUM findings exceed this count

  ImageScanLowThreshold:
    Type: String
    Default: "50"
    AllowedPattern: "^[0-9]+$"
    Description: Fail the scan when LOW findings exceed this count

  ContainerClusterName:
    Type: String
    MinLength: 1
    Description: Existing ECS cluster name

  ContainerServiceName:
    Type: String
    MinLength: 1
    Description: Existing ECS service name in ContainerClusterName

  ContainerName:
    Type: String
    MinLength: 1
    Description: Container name in the service's task definition (written to imagedefinitions.json)

  DeploymentWindowCron:
    Type: String
    Default: "0 0 9-17 ? * MON-FRI *"
    Description: "Allowed days/times. Fields: Seconds Minutes Hours Day-of-month Month Day-of-week [Year]. Default = AWS example, 09:00-17:59 Mon-Fri"

  DeploymentWindowTimeZone:
    Type: String
    Default: UTC
    Description: Region/City (Europe/Berlin), UTC[+-HH:MM], or an abbreviation (EST). UTC format is the default

  DeployRollbackAlarmName:
    Type: String
    MinLength: 1
    Description: Existing CloudWatch alarm (e.g. error rate). In ALARM after Deploy succeeds = roll back

  DeployRollbackAlarmWaitTimeInMinutes:
    Type: String
    Default: "1"
    AllowedPattern: "^[0-9]+$"
    Description: CloudWatchAlarm rule WaitTime - minutes an alarm already in ALARM gets to recover before rollback

  DeployBakeTimeInMinutes:
    Type: Number
    Default: 5
    MinValue: 1
    MaxValue: 50
    Description: Minutes to wait after the ECS deploy before the On Success check (Commands timeout is 55)

Resources:

  # ---------------------------------------------------------------
  # Source Repository + Container Image Repository + S3 Buckets
  # ---------------------------------------------------------------

  CodeCommitRepository:
    Type: AWS::CodeCommit::Repository
    DeletionPolicy: Retain # Keep code if the stack is deleted
    UpdateReplacePolicy: Retain
    Properties:
      RepositoryName: !Sub "${Application}-${Environment}-all-features"
      RepositoryDescription: CodePipeline V2 all-features demo - Dockerfile in the root
      Tags:
        - Key: Name
          Value: !Sub "${Application}-${Environment}-all-features-codecommit-repository"

  ContainerImageRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub "${Application}-${Environment}-all-features"
      ImageTagMutability: MUTABLE # ImageTag value can repeat across runs; deploys are pinned by digest
      EncryptionConfiguration:
        EncryptionType: AES256
      EmptyOnDelete: true # Allows stack delete with images present
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Keep the 20 most recent images",
                "selection": {
                  "tagStatus": "any",
                  "countType": "imageCountMoreThan",
                  "countNumber": 20
                },
                "action": { "type": "expire" }
              }
            ]
          }
      Tags:
        - Key: Name
          Value: !Sub "${Application}-${Environment}-all-features-container-image-repository"

  ArtifactBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: expire-artifacts
            Status: Enabled
            ExpirationInDays: 30 # Rollback reuses old artifacts - keep this longer than your rollback horizon
      Tags:
        - Key: Name
          Value: !Sub "${Application}-${Environment}-all-features-pipeline-artifact-bucket"

  # ---------------------------------------------------------------
  # IAM Roles
  # ---------------------------------------------------------------

  PipelineServiceRole:
    Type: AWS::IAM::Role
    Properties:
      Description: CodePipeline V2 role - CodeCommit, artifacts, ECR, Inspector, ECS deploy, alarm read, managed compute logs
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: codepipeline.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: pipeline-service-policy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: CodeCommitSource
                Effect: Allow
                Action:
                  - codecommit:CancelUploadArchive
                  - codecommit:GetBranch
                  - codecommit:GetCommit
                  - codecommit:GetRepository
                  - codecommit:GetUploadArchiveStatus
                  - codecommit:UploadArchive
                Resource: !GetAtt CodeCommitRepository.Arn
              - Sid: ReadWriteArtifacts
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:PutObject
                  - s3:GetBucketVersioning
                  - s3:GetBucketLocation
                  - s3:ListBucket
                Resource:
                  - !GetAtt ArtifactBucket.Arn
                  - !Sub "${ArtifactBucket.Arn}/*"
              - Sid: EcrAuthorization
                Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                  - ecr:DescribeRepositories
                  - sts:GetServiceBearerToken
                Resource: "*" # Account-level calls, no resource scoping
              # ECRBuildAndPublish push + InspectorScan pull + Verify DescribeImages
              - Sid: EcrPushPullImage
                Effect: Allow
                Action:
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                  - ecr:PutImage
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchCheckLayerAvailability
                  - ecr:BatchGetImage
                  - ecr:DescribeImages
                Resource: !GetAtt ContainerImageRepository.Arn
              - Sid: InspectorScanSbom
                Effect: Allow
                Action: inspector-scan:ScanSbom
                Resource: "*" # No resource-level scoping for this action
              # ECS standard deploy action - minimum permissions per the action reference
              - Sid: ContainerTaskDefinition
                Effect: Allow
                Action:
                  - ecs:DescribeTaskDefinition
                  - ecs:RegisterTaskDefinition
                Resource: "*"
              - Sid: ContainerService
                Effect: Allow
                Action:
                  - ecs:DescribeServices
                  - ecs:UpdateService
                Resource: !Sub "arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:service/${ContainerClusterName}/${ContainerServiceName}"
              - Sid: ContainerTaskDefinitionTag
                Effect: Allow
                Action: ecs:TagResource
                Resource: !Sub "arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:task-definition/*"
                Condition:
                  StringEquals:
                    ecs:CreateAction: RegisterTaskDefinition
              - Sid: ContainerTaskPassRole
                Effect: Allow
                Action: iam:PassRole
                Resource: "*" # Scope to your task + execution role ARNs for production
                Condition:
                  StringEquals:
                    iam:PassedToService:
                      - ecs.amazonaws.com
                      - ecs-tasks.amazonaws.com
              # CloudWatchAlarm rule (runs as this role) + Bake step. Inferred - the rule
              # reference lists no permissions
              - Sid: DeployRollbackAlarmRead
                Effect: Allow
                Action: cloudwatch:DescribeAlarms
                Resource: !Sub "arn:${AWS::Partition}:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:${DeployRollbackAlarmName}"
              - Sid: ManagedComputeLogs
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codepipeline/${Application}-${Environment}-all-features-pipeline"
                  - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codepipeline/${Application}-${Environment}-all-features-pipeline:*"
      Tags:
        - Key: Name
          Value: !Sub "${Application}-${Environment}-all-features-pipeline-service-role"

  PipelineTriggerEventRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Allows EventBridge to start the pipeline
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: start-pipeline-execution
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: codepipeline:StartPipelineExecution
                Resource: !Sub "arn:${AWS::Partition}:codepipeline:${AWS::Region}:${AWS::AccountId}:${Pipeline}"
      Tags:
        - Key: Name
          Value: !Sub "${Application}-${Environment}-all-features-pipeline-trigger-event-role"

  # ---------------------------------------------------------------
  # Log Groups
  # ---------------------------------------------------------------

  # Shared by ECRBuildAndPublish, InspectorScan and Commands (managed CodeBuild compute)
  PipelineManagedComputeLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub "/aws/codepipeline/${Application}-${Environment}-all-features-pipeline"
      RetentionInDays: 7

  # ---------------------------------------------------------------
  # Pipeline
  # ---------------------------------------------------------------

  Pipeline:
    Type: AWS::CodePipeline::Pipeline
    DependsOn: PipelineManagedComputeLogGroup
    Properties:
      Name: !Sub "${Application}-${Environment}-all-features-pipeline" # Fixed so the log group name is known. Changing it replaces the pipeline
      RoleArn: !GetAtt PipelineServiceRole.Arn # Also the identity the managed compute actions and the rules run as
      PipelineType: V2
      ExecutionMode: QUEUED # [V2] Every commit is built, scanned and deployed in order. PARALLEL would rule out ROLLBACK
      ArtifactStore:
        Type: S3
        Location: !Ref ArtifactBucket

      # [V2] Pipeline-level variables, referenced as #{variables.<Name>}.
      # Defaults apply to triggered runs; start-pipeline-execution --variables overrides them per run.
      Variables: # Max 50
        - Name: ImageTag
          DefaultValue: !Ref ImageTagDefault
          Description: Extra tag pushed with the image (alongside the commit SHA)
        - Name: RunImageScan
          DefaultValue: "true"
          Description: Anything other than true skips the Scan stage (e.g. an urgent hotfix)

      Stages:

        - Name: Source
          Actions:
            - Name: Source
              ActionTypeId:
                Category: Source
                Owner: AWS
                Provider: CodeCommit
                Version: "1"   # Action type version (every AWS action is "1"), not the pipeline's version
              Namespace: SourceVariables # Required to reference outputs: CommitId, BranchName, ...
              Configuration:  # No #{variables.*} here: pipeline-level variables cannot be used in Source actions
                RepositoryName: !GetAtt CodeCommitRepository.Name
                BranchName: !Ref SourceBranchName
                PollForSourceChanges: false # Omitted = true (polling). False because EventBridge starts it; both = duplicate runs
              OutputArtifacts:
                - Name: SourceArtifact
              RunOrder: 1

        - Name: Build
          Actions:
            - Name: BuildAndPublishImage
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: ECRBuildAndPublish # [V2] Replaces a CodeBuild project + docker buildspec
                Version: "1"
              Namespace: BuildVariables # -> ECRImageDigestId, ECRRepositoryName
              Configuration:
                ECRRepositoryName: !Ref ContainerImageRepository # Repository must already exist
                ImageTags: "#{variables.ImageTag},#{SourceVariables.CommitId}" # Pipeline variable + action output variable. DockerFilePath omitted = repo root
              InputArtifacts:
                - Name: SourceArtifact
              RunOrder: 1
          # [V2] Automatic retry: one attempt, re-running only the failed actions.
          # Cannot be combined with OnFailure Conditions.
          OnFailure:
            Result: RETRY
            RetryConfiguration:
              RetryMode: FAILED_ACTIONS # or ALL_ACTIONS

        - Name: Scan
          # [V2] Entry condition with SKIP: if the rule fails the stage is skipped
          # (status Skipped) instead of failing the run
          BeforeEntry:
            Conditions:
              - Result: SKIP # Only supported with LambdaInvoke / VariableCheck rules
                Rules:
                  - Name: RunImageScanEnabled
                    RuleTypeId:
                      Category: Rule # Always "Rule"; Provider is the rule type
                      Owner: AWS
                      Provider: VariableCheck
                      Version: "1"
                    Configuration:
                      Variable: "#{variables.RunImageScan}"
                      Operator: EQ # EQ | NE | CONTAINS | MATCHES (Java regex)
                      Value: "true"
          Actions:
            - Name: ScanImage
              ActionTypeId:
                Category: Invoke
                Owner: AWS
                Provider: InspectorScan # Managed compute; not marked V2-only in its action reference
                Version: "1"
              Namespace: ScanVariables # -> HighestScannedSeverity (medium | high | critical)
              Configuration:
                InspectorRunMode: ECRImageScan # or SourceCodeScan (scans the source input artifact instead)
                ECRRepositoryName: !Ref ContainerImageRepository
                ImageTag: "#{SourceVariables.CommitId}" # Takes a tag, not a digest
                # Fail when the count at a severity is ABOVE its threshold
                CriticalThreshold: !Ref ImageScanCriticalThreshold
                HighThreshold: !Ref ImageScanHighThreshold
                MediumThreshold: !Ref ImageScanMediumThreshold
                LowThreshold: !Ref ImageScanLowThreshold
              # No InputArtifacts: ECRImageScan reads the image from ECR
              OutputArtifacts:
                - Name: ImageSbomArtifact # SBOM with vulnerability details (artifact bucket)
              RunOrder: 1

        - Name: Verify
          Actions:
            - Name: WriteImageDefinitions
              ActionTypeId:
                Category: Compute
                Owner: AWS
                Provider: Commands  # [V2] Commands / EnvironmentVariables / OutputVariables are action properties, not Configuration
                Version: "1"
              EnvironmentVariables: # #{...} resolved by CodePipeline at run time; !Ref/!Sub by CloudFormation at deploy time
                - Name: IMAGE_REGISTRY
                  Value: !Sub "${AWS::AccountId}.dkr.ecr.${AWS::Region}.${AWS::URLSuffix}"
                - Name: IMAGE_REPOSITORY
                  Value: "#{BuildVariables.ECRRepositoryName}"
                - Name: IMAGE_DIGEST
                  Value: "#{BuildVariables.ECRImageDigestId}"
                - Name: CONTAINER_NAME
                  Value: !Ref ContainerName
                # No ScanVariables reference here: Scan can be skipped, so its action never runs
              Commands:
                # Docs say "the sha256 digest" without showing the format; ensure the sha256: prefix
                - "case \"$IMAGE_DIGEST\" in sha256:*) ;; *) IMAGE_DIGEST=\"sha256:$IMAGE_DIGEST\" ;; esac"
                - "aws ecr describe-images --repository-name \"$IMAGE_REPOSITORY\" --image-ids imageDigest=\"$IMAGE_DIGEST\" --query \"imageDetails[0].{tags:imageTags,pushedAt:imagePushedAt}\""
                - "printf '[{\"name\":\"%s\",\"imageUri\":\"%s\"}]' \"$CONTAINER_NAME\" \"$IMAGE_REGISTRY/$IMAGE_REPOSITORY@$IMAGE_DIGEST\" > imagedefinitions.json"
                - "cat imagedefinitions.json"
              InputArtifacts:
                - Name: SourceArtifact # Commands requires at least one input artifact
              OutputArtifacts:
                - Name: ImageDefinitionsArtifact # This is what a rollback reuses from the last good run
                  Files:            # Commands only: workspace files to put in the artifact
                    - imagedefinitions.json
              RunOrder: 1

        - Name: Deploy
          # [V2] Checked BEFORE the stage starts
          BeforeEntry:
            Conditions:
              - Result: FAIL # Entry allows FAIL or SKIP; SKIP only works with LambdaInvoke / VariableCheck
                Rules:
                  - Name: BusinessHoursWindow
                    RuleTypeId:
                      Category: Rule
                      Owner: AWS
                      Provider: DeploymentWindow
                      Version: "1"
                    Configuration:
                      Cron: !Ref DeploymentWindowCron # Rule succeeds when "now" matches the cron
                      TimeZone: !Ref DeploymentWindowTimeZone
          Actions:
            - Name: DeployToContainerService
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Provider: ECS      # "ECS standard": updates the service; the service's own deployment config decides how it rolls out
                Version: "1"
              Configuration:
                ClusterName: !Ref ContainerClusterName
                ServiceName: !Ref ContainerServiceName
                FileName: imagedefinitions.json
              InputArtifacts:
                - Name: ImageDefinitionsArtifact
              RunOrder: 1
            # Gives the alarm time to see traffic on the new version before the
            # On Success check (the rule passes at once if the alarm is OK)
            - Name: BakeAndWatchAlarm
              ActionTypeId:
                Category: Compute
                Owner: AWS
                Provider: Commands
                Version: "1"
              EnvironmentVariables:
                - Name: BAKE_MINUTES
                  Value: !Ref DeployBakeTimeInMinutes
                - Name: ALARM_NAME
                  Value: !Ref DeployRollbackAlarmName
              Commands:
                - "echo \"Baking for $BAKE_MINUTES minute(s), watching alarm $ALARM_NAME\""
                - "for i in $(seq 1 $BAKE_MINUTES); do sleep 60; echo minute $i: $(aws cloudwatch describe-alarms --alarm-names \"$ALARM_NAME\" --query 'MetricAlarms[0].StateValue' --output text); done"
              InputArtifacts:
                - Name: ImageDefinitionsArtifact # Commands requires at least one input artifact
              RunOrder: 2  # After the deploy
          # [V2] Checked AFTER the stage succeeds. Rollback = new "rollback" execution
          # re-running this stage with the last successful execution's artifacts
          # (previous imagedefinitions.json = previous digest)
          OnSuccess:
            Conditions:
              - Result: ROLLBACK # On Success allows ROLLBACK or FAIL
                Rules:
                  - Name: ErrorRateAlarm
                    RuleTypeId:
                      Category: Rule
                      Owner: AWS
                      Provider: CloudWatchAlarm
                      Version: "1"
                    Configuration:
                      AlarmName: !Ref DeployRollbackAlarmName
                      WaitTime: !Ref DeployRollbackAlarmWaitTimeInMinutes

      Tags:
        - Key: Name
          Value: !Sub "${Application}-${Environment}-all-features-pipeline"

  # ---------------------------------------------------------------
  # EventBridge Trigger (CodeCommit push -> pipeline)
  # ---------------------------------------------------------------

  PipelineTriggerEventRule:
    Type: AWS::Events::Rule
    Properties:
      Description: Start the pipeline on push to the source branch
      State: ENABLED
      EventPattern:
        source:
          - aws.codecommit
        detail-type:
          - CodeCommit Repository State Change
        resources:
          - !GetAtt CodeCommitRepository.Arn
        detail:
          event:
            - referenceCreated
            - referenceUpdated
          referenceType:
            - branch
          referenceName:
            - !Ref SourceBranchName
      Targets:
        - Id: pipeline
          Arn: !Sub "arn:${AWS::Partition}:codepipeline:${AWS::Region}:${AWS::AccountId}:${Pipeline}"
          RoleArn: !GetAtt PipelineTriggerEventRole.Arn

Outputs:

  CodeCommitCloneUrlGrc:
    Description: git-remote-codecommit URL (pip install git-remote-codecommit)
    Value: !Sub "codecommit::${AWS::Region}://${CodeCommitRepository.Name}"

  CodeCommitCloneUrlHttp:
    Value: !GetAtt CodeCommitRepository.CloneUrlHttp

  ContainerImageRepositoryUri:
    Value: !GetAtt ContainerImageRepository.RepositoryUri

  PipelineName:
    Value: !Ref Pipeline

  ArtifactBucketName:
    Description: Source zips, SBOMs and imagedefinitions.json per execution
    Value: !Ref ArtifactBucket
