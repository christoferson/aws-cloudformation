AWSTemplateFormatVersion: "2010-09-09"
Description: CodePipeline V2 source - S3 object (versioned bucket, EventBridge notifications, object key override)

# -----------------------------------------------------------------------------
# Summary
#   Source: an Amazon S3 object (zip).
#     upload source.zip -> S3 "Object Created" event -> EventBridge rule
#       -> Source (S3) -> ShowSource (Commands)
#   ShowSource prints the S3 action's output variables.
#   Uses the bucket's EventBridge notifications, so no CloudTrail trail is needed
#   (the method the docs recommend for CLI / CloudFormation).
#
# Resources created
#   - AWS::S3::Bucket x2              (source: versioned + EventBridge; artifact store)
#   - AWS::IAM::Role x2               (pipeline service role, EventBridge)
#   - AWS::Logs::LogGroup             (/aws/codepipeline/<pipeline-name>)
#   - AWS::CodePipeline::Pipeline
#   - AWS::Events::Rule               (Object Created on SourceObjectKey -> pipeline)
#
# Pre-requisites
#   - None. Upload a zip to the source bucket after deploy
#
# Assumptions
#   - AllowOverrideForS3ObjectKey true lets a manual run pick another key with
#     --source-revisions actionName=Source,revisionType=S3_OBJECT_KEY,revisionValue=<key>
#   - The first execution at stack creation fails at Source (object not uploaded yet)
#   - Buckets are not emptied on stack delete; empty them first
# -----------------------------------------------------------------------------

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Application
        Parameters:
          - Application
          - Environment
      - Label:
          default: Source
        Parameters:
          - SourceObjectKey

Parameters:

  Application:
    Type: String
    Default: myapp
    Description: Application name used as a prefix for all resources

  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, stg, prod]
    Description: Deployment environment

  SourceObjectKey:
    Type: String
    Default: source.zip
    Description: Object key (zip) in the source bucket that starts the pipeline

Resources:

  # ---------------------------------------------------------------
  # S3 Buckets
  # ---------------------------------------------------------------

  SourceBucket:
    Type: AWS::S3::Bucket
    Properties:
      VersioningConfiguration:
        Status: Enabled # Required by the S3 source action
      NotificationConfiguration:
        EventBridgeConfiguration:
          EventBridgeEnabled: true # Sends "Object Created" events to EventBridge; no CloudTrail trail needed
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Name
          Value: !Sub "${Application}-${Environment}-source-s3-source-bucket"

  ArtifactBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: expire-artifacts
            Status: Enabled
            ExpirationInDays: 30
      Tags:
        - Key: Name
          Value: !Sub "${Application}-${Environment}-source-s3-pipeline-artifact-bucket"

  # ---------------------------------------------------------------
  # IAM Roles
  # ---------------------------------------------------------------

  PipelineServiceRole:
    Type: AWS::IAM::Role
    Properties:
      Description: CodePipeline V2 role - S3 source, artifacts, Commands logs
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: codepipeline.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: pipeline-service-policy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # S3 source action - permissions per the action reference
              - Sid: S3Source
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:GetBucketVersioning
                  - s3:GetBucketAcl
                  - s3:GetBucketLocation
                  - s3:GetObjectTagging
                  - s3:GetObjectVersionTagging
                Resource:
                  - !GetAtt SourceBucket.Arn
                  - !Sub "${SourceBucket.Arn}/*"
                Condition:
                  StringEquals:
                    aws:ResourceAccount: !Ref AWS::AccountId # Only buckets owned by this account
              - Sid: ReadWriteArtifacts
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:PutObject
                  - s3:GetBucketVersioning
                  - s3:GetBucketLocation
                  - s3:ListBucket
                Resource:
                  - !GetAtt ArtifactBucket.Arn
                  - !Sub "${ArtifactBucket.Arn}/*"
              - Sid: CommandsActionLogs
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codepipeline/${Application}-${Environment}-source-s3-pipeline"
                  - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codepipeline/${Application}-${Environment}-source-s3-pipeline:*"
      Tags:
        - Key: Name
          Value: !Sub "${Application}-${Environment}-source-s3-pipeline-service-role"

  PipelineTriggerEventRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Allows EventBridge to start the pipeline
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: start-pipeline-execution
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: codepipeline:StartPipelineExecution
                Resource: !Sub "arn:${AWS::Partition}:codepipeline:${AWS::Region}:${AWS::AccountId}:${Pipeline}"
      Tags:
        - Key: Name
          Value: !Sub "${Application}-${Environment}-source-s3-pipeline-trigger-event-role"

  # ---------------------------------------------------------------
  # Log Groups
  # ---------------------------------------------------------------

  PipelineCommandsLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub "/aws/codepipeline/${Application}-${Environment}-source-s3-pipeline"
      RetentionInDays: 7

  # ---------------------------------------------------------------
  # Pipeline
  # ---------------------------------------------------------------

  Pipeline:
    Type: AWS::CodePipeline::Pipeline
    DependsOn: PipelineCommandsLogGroup
    Properties:
      Name: !Sub "${Application}-${Environment}-source-s3-pipeline" # Fixed so the log group name is known. Changing it replaces the pipeline
      RoleArn: !GetAtt PipelineServiceRole.Arn # Also the identity the Commands action runs as
      PipelineType: V2
      ExecutionMode: QUEUED
      ArtifactStore:
        Type: S3
        Location: !Ref ArtifactBucket

      Stages:

        - Name: Source
          Actions:
            - Name: Source
              ActionTypeId:
                Category: Source
                Owner: AWS
                Provider: S3
                Version: "1"   # Action type version (every AWS action is "1"), not the pipeline's version
              Namespace: SourceVariables # Required to reference the output variables below
              Configuration:
                S3Bucket: !Ref SourceBucket
                S3ObjectKey: !Ref SourceObjectKey
                PollForSourceChanges: false # Omitted = true (polling). False because EventBridge starts it; both = duplicate runs
                AllowOverrideForS3ObjectKey: true # [V2 source override] Omitted = false: S3_OBJECT_KEY overrides are refused
              OutputArtifacts:
                - Name: SourceArtifact # The object itself
              RunOrder: 1

        - Name: ShowSource
          Actions:
            - Name: PrintSourceVariables
              ActionTypeId:
                Category: Compute
                Owner: AWS
                Provider: Commands  # [V2] Commands / EnvironmentVariables are action properties, not Configuration
                Version: "1"
              EnvironmentVariables: # S3 output variables
                - Name: BUCKET_NAME
                  Value: "#{SourceVariables.BucketName}"
                - Name: OBJECT_KEY
                  Value: "#{SourceVariables.ObjectKey}" # Differs from SourceObjectKey when overridden
                - Name: VERSION_ID
                  Value: "#{SourceVariables.VersionId}"
                - Name: ETAG
                  Value: "#{SourceVariables.ETag}" # MD5 of the content; metadata-only changes don't change it
              Commands:
                - "echo \"s3://$BUCKET_NAME/$OBJECT_KEY version $VERSION_ID etag $ETAG\""
                - "ls -la"
              InputArtifacts:
                - Name: SourceArtifact # Commands requires at least one input artifact
              RunOrder: 1

      Tags:
        - Key: Name
          Value: !Sub "${Application}-${Environment}-source-s3-pipeline"

  # ---------------------------------------------------------------
  # EventBridge Trigger (S3 Object Created -> pipeline)
  # ---------------------------------------------------------------

  PipelineTriggerEventRule:
    Type: AWS::Events::Rule
    Properties:
      Description: Start the pipeline when the source object is uploaded
      State: ENABLED
      EventPattern:
        source:
          - aws.s3
        detail-type:
          - Object Created
        detail:
          bucket:
            name:
              - !Ref SourceBucket
          object:
            key:
              - !Ref SourceObjectKey # AWS's example filters on the bucket only; this also limits it to one key
      Targets:
        - Id: pipeline
          Arn: !Sub "arn:${AWS::Partition}:codepipeline:${AWS::Region}:${AWS::AccountId}:${Pipeline}"
          RoleArn: !GetAtt PipelineTriggerEventRole.Arn

Outputs:

  SourceBucketName:
    Description: Upload the source zip here
    Value: !Ref SourceBucket

  PipelineName:
    Value: !Ref Pipeline

  ArtifactBucketName:
    Value: !Ref ArtifactBucket
