AWSTemplateFormatVersion: "2010-09-09"
Description: AWS Organizations RCP - data perimeter (TLS only, deny principals outside the organization)

# -----------------------------------------------------------------------------
# Summary
#   A resource control policy (RCP) that caps what ANY principal can do to
#   resources in the target accounts, whatever the bucket / key / queue
#   policies say:
#     EnforceSecureTransport   deny requests not sent over TLS
#     EnforceOrgIdentities     deny principals that are not in this
#                              organization, except AWS service principals
#   SCP vs RCP: an SCP limits what YOUR principals can do; an RCP limits what
#   can be done TO YOUR resources (including by external principals).
#   Content is a JSON object so CloudFormation drift detection works.
#
# Resources created
#   - AWS::Organizations::Policy (RESOURCE_CONTROL_POLICY)
#
# Pre-requisites
#   - Deploy in the organization's management account (or a delegated
#     administrator for policy management); organization with all features
#   - RCPs enabled on the root (one-time, CloudFormation cannot do this):
#       aws organizations enable-policy-type --root-id r-xxxx --policy-type RESOURCE_CONTROL_POLICY
#     Enabling attaches the AWS managed RCPFullAWSAccess everywhere (cannot be
#     detached); it lets everything through until you attach Deny RCPs
#
# Assumptions
#   - Attach to a test OU first. RCPs do not affect resources in the management
#     account, and do not apply to calls made by service-linked roles
#   - RCP rules: Effect must be Deny, Principal must be "*" (narrow with
#     Condition), Action cannot be "*" alone (name the service), and
#     NotAction / NotPrincipal are not supported
#   - Only services on the RCP supported list are affected; this policy uses
#     s3, sqs, kms, secretsmanager and sts (all on the list)
#   - EnforceOrgIdentities blocks legitimate cross-organization access too
#     (partners, third-party tools, cross-org sts:AssumeRole). Review IAM
#     Access Analyzer external access findings and CloudTrail before attaching
#   - Maximum RCP size is 5,120 characters
# -----------------------------------------------------------------------------

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Application
        Parameters:
          - Application
          - Environment
      - Label:
          default: Organization
        Parameters:
          - OrganizationId
          - TargetId

Parameters:

  Application:
    Type: String
    Default: myapp
    Description: Application name used as a prefix for all resources

  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, stg, prod]
    Description: Deployment environment

  OrganizationId:
    Type: String
    AllowedPattern: "^o-[a-z0-9]{10,32}$"
    Description: "This organization's ID (o-...): aws organizations describe-organization --query Organization.Id"

  TargetId:
    Type: String
    AllowedPattern: "^(r-[0-9a-z]{4,32})|(\\d{12})|(ou-[0-9a-z]{4,32}-[a-z0-9]{8,32})$"
    Description: Root (r-...), OU (ou-...-...) or account ID (12 digits) to attach the RCP to. Use a test OU first

Resources:

  DataPerimeterResourceControlPolicy:
    Type: AWS::Organizations::Policy
    Properties:
      Name: !Sub "${Application}-${Environment}-rcp-data-perimeter"
      Description: Deny non-TLS access and access by principals outside the organization
      Type: RESOURCE_CONTROL_POLICY # Update requires replacement
      TargetIds:
        - !Ref TargetId
      Content: # JSON object (not a string) so drift detection works
        Version: "2012-10-17" # Required in every RCP
        Statement:
          - Sid: EnforceSecureTransport
            Effect: Deny # Customer managed RCPs must Deny
            Principal: "*" # Required in RCPs and must be "*"
            Action: # Name services; "*" alone is not allowed
              - "s3:*"
              - "sqs:*"
              - "kms:*"
              - "secretsmanager:*"
              - "sts:*"
            Resource: "*"
            Condition:
              BoolIfExists:
                aws:SecureTransport: "false" # Key is always present; false = not TLS
          - Sid: EnforceOrgIdentities
            Effect: Deny
            Principal: "*"
            Action:
              - "s3:*"
              - "sqs:*"
              - "kms:*"
              - "secretsmanager:*"
              - "sts:AssumeRole"
            Resource: "*"
            Condition: # Both must match (AND)
              StringNotEqualsIfExists: # aws:PrincipalOrgID is absent for anonymous calls -> IfExists denies them too
                aws:PrincipalOrgID: !Ref OrganizationId
              BoolIfExists: # Let AWS service principals (e.g. cloudtrail.amazonaws.com) through
                aws:PrincipalIsAWSService: "false"
      Tags:
        - Key: Name
          Value: !Sub "${Application}-${Environment}-rcp-data-perimeter"

Outputs:

  DataPerimeterResourceControlPolicyId:
    Value: !GetAtt DataPerimeterResourceControlPolicy.Id

  DataPerimeterResourceControlPolicyArn:
    Value: !GetAtt DataPerimeterResourceControlPolicy.Arn
