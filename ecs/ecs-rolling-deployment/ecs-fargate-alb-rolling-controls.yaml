AWSTemplateFormatVersion: "2010-09-09"
Description: ECS Fargate + ALB rolling deployment - circuit breaker threshold, early success, alarm rollback, 20s metrics, container restart

# -----------------------------------------------------------------------------
# Summary
#   Fargate service using the ROLLING strategy (task replacement) with the
#   newer deployment and resilience controls:
#     - DeploymentCircuitBreaker ThresholdConfiguration + ResetOnHealthyTask
#       (how many task failures before the deployment fails and rolls back)
#     - EarlySuccessCriteria (complete when HealthyPercent of tasks are healthy;
#       DEFERRED = clean up the old tasks after completion)
#     - Alarms + BakeTimeInMinutes (alarm-based rollback; bake time only
#       applies when alarm-based rollback is used)
#     - Monitoring (service CPU / memory metrics at 20-second resolution)
#     - AvailabilityZoneRebalancing ENABLED
#     - Container RestartPolicy (restart a crashed container in place instead
#       of replacing the task)
#   To deploy: change ContainerImageName and update the stack.
#
# Resources created
#   - Security groups for the load balancer and the container service
#   - Internet-facing ALB + listener (:80) + target group
#   - ECS Cluster, Task Definition, Service (Fargate, ROLLING)
#   - IAM task execution role, log group
#   - CloudWatch alarm (ALB target 5XX) used for automatic rollback
#
# Pre-requisites
#   - A VPC with at least 2 public subnets (IGW route) in different AZs
#
# Assumptions
#   - ALB and tasks share the same public subnets; tasks get public IPs to pull
#     images without NAT. Security Hub [ECS.2] flags public IPs; use private
#     subnets with NAT / VPC endpoints for production
#   - The circuit breaker and early success criteria are rolling-only
#   - EarlySuccessHealthyPercent must be between MinimumHealthyPercent (50 here)
#     and 100. After early success the circuit breaker and alarm rollback no
#     longer apply; ECS launches the remaining tasks through normal scaling
#   - Setting a bake time on a rolling deployment raises the CloudFormation
#     handler timeout to 36 hours
#   - Container restart policy on EC2 needs container agent 1.86.0+; not
#     supported for Windows containers on Fargate
#   - Since September 5, 2025 AZ rebalancing is on by default for eligible new
#     services; it is set explicitly here because updates of services that never
#     set it treat it as DISABLED
# -----------------------------------------------------------------------------

Metadata:
  "AWS::CloudFormation::Interface":
    ParameterGroups:
      - Label:
          default: "Application"
        Parameters:
          - Application
          - Environment
      - Label:
          default: "Network"
        Parameters:
          - VpcId
          - VpcSubnetList
      - Label:
          default: "Container"
        Parameters:
          - ContainerImageName
          - ContainerPort
          - TaskCpu
          - TaskMemory
      - Label:
          default: "Service / Rolling Deployment"
        Parameters:
          - TaskDesiredCount
          - CircuitBreakerFailureCount
          - EarlySuccessHealthyPercent
          - DeploymentBakeTimeInMinutes

# ---------------------------------------------------------------
# Parameters
# ---------------------------------------------------------------
Parameters:

  Application:
    Type: String
    Default: myapp
    Description: Application name used as a prefix for all resources

  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, stg, prod]
    Description: Deployment environment

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC to deploy into

  VpcSubnetList:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Public subnet IDs (min 2 AZs) for the ALB and tasks

  ContainerImageName:
    Type: String
    Default: "public.ecr.aws/docker/library/nginx:1.27"
    Description: Container image URI. Change it (e.g. to ...nginx:1.28) and update the stack to trigger a rolling deployment

  ContainerPort:
    Type: Number
    Default: 80
    Description: Port the container listens on

  TaskCpu:
    Type: Number
    Default: 256
    AllowedValues: [256, 512, 1024, 2048, 4096]
    Description: Task CPU units (256 = 0.25 vCPU)

  TaskMemory:
    Type: Number
    Default: 512
    AllowedValues: [512, 1024, 2048, 4096, 8192]
    Description: Task memory in MiB (must be a valid Fargate combination with TaskCpu)

  TaskDesiredCount:
    Type: Number
    Default: 4
    MinValue: 2
    Description: Desired number of running tasks (4 makes the healthy-percent steps visible)

  CircuitBreakerFailureCount:
    Type: Number
    Default: 3
    MinValue: 1
    Description: Task failures tolerated before the deployment fails and rolls back (ThresholdConfiguration Type COUNT)

  EarlySuccessHealthyPercent:
    Type: Number
    Default: 75
    MinValue: 50
    MaxValue: 100
    Description: Percent of desired tasks healthy on the new revision to complete the deployment (>= MinimumHealthyPercent 50)

  DeploymentBakeTimeInMinutes:
    Type: Number
    Default: 2
    MinValue: 0
    MaxValue: 60
    Description: Minutes the alarm keeps watching after the healthy percent is reached (rolling has no default bake time)

# ---------------------------------------------------------------
# Resources
# ---------------------------------------------------------------
Resources:

  # ---------------------------------------------------------------
  # Security Groups
  # ---------------------------------------------------------------

  LoadBalancerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      VpcId: !Ref VpcId
      GroupDescription: Allow HTTP to the load balancer
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: "0.0.0.0/0"
      Tags:
        - Key: Name
          Value: !Sub "${Application}-${Environment}-loadbalancer-securitygroup"

  ContainerServiceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      VpcId: !Ref VpcId
      GroupDescription: Allow inbound from the load balancer to ECS task ENIs
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: !Ref ContainerPort
          ToPort: !Ref ContainerPort
          SourceSecurityGroupId: !Ref LoadBalancerSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub "${Application}-${Environment}-containerservice-securitygroup"

  # ---------------------------------------------------------------
  # Load Balancer + Listener + Target Group
  # ---------------------------------------------------------------

  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Scheme: internet-facing
      SecurityGroups:
        - !Ref LoadBalancerSecurityGroup
      Subnets: !Ref VpcSubnetList
      LoadBalancerAttributes:
        - Key: deletion_protection.enabled
          Value: "false"
        - Key: idle_timeout.timeout_seconds
          Value: "60"
      Tags:
        - Key: Name
          Value: !Sub "${Application}-${Environment}-loadbalancer"

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref VpcId
      Protocol: HTTP
      Port: !Ref ContainerPort
      TargetType: ip
      HealthCheckPath: /
      HealthCheckIntervalSeconds: 10
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 2
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: "30" # Default 300s keeps old tasks draining longer
      Tags:
        - Key: Name
          Value: !Sub "${Application}-${Environment}-container-targetgroup"

  LoadBalancerListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Protocol: HTTP
      Port: 80
      DefaultActions:
        - Type: forward # Rolling uses one target group; old and new tasks are both registered during the rollout
          TargetGroupArn: !Ref TargetGroup

  # ---------------------------------------------------------------
  # Cluster / Compute
  # ---------------------------------------------------------------

  ContainerCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub "${Application}-${Environment}-rolling"
      CapacityProviders:
        - FARGATE
      ClusterSettings:
        - Name: containerInsights
          Value: enabled # Also reports container restart counts
      Tags:
        - Key: Name
          Value: !Sub "${Application}-${Environment}-containercluster"

  # ---------------------------------------------------------------
  # IAM Roles
  # ---------------------------------------------------------------

  ContainerTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Tags:
        - Key: Name
          Value: !Sub "${Application}-${Environment}-container-task-execution-role"

  # ---------------------------------------------------------------
  # Log Groups
  # ---------------------------------------------------------------

  ContainerTaskLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub "/ecs/${Application}/${Environment}/rolling"
      RetentionInDays: 7

  # ---------------------------------------------------------------
  # Task Definition
  # ---------------------------------------------------------------

  ContainerTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "${Application}-${Environment}-rolling-task"
      RequiresCompatibilities:
        - FARGATE
      NetworkMode: awsvpc
      Cpu: !Ref TaskCpu
      Memory: !Ref TaskMemory
      ExecutionRoleArn: !GetAtt ContainerTaskExecutionRole.Arn
      ContainerDefinitions:
        - Name: !Sub "${Application}-${Environment}-container"
          Image: !Ref ContainerImageName
          Essential: true
          PortMappings:
            - ContainerPort: !Ref ContainerPort
              Protocol: tcp
          # Restart the container in place when it exits, without replacing the task
          RestartPolicy:
            Enabled: true # Off by default
            IgnoredExitCodes:
              - 0 # A clean exit is not restarted (max 50 codes)
            RestartAttemptPeriod: 60 # Must have run 60s (60-1800, default 300) before a restart; at most one restart per period
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref ContainerTaskLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs
      Tags:
        - Key: Name
          Value: !Sub "${Application}-${Environment}-container-taskdefinition"

  # ---------------------------------------------------------------
  # Service
  # ---------------------------------------------------------------

  ContainerService:
    Type: AWS::ECS::Service
    DependsOn: LoadBalancerListener
    Properties:
      Cluster: !Ref ContainerCluster
      ServiceName: !Sub "${Application}-${Environment}-rolling-service"
      LaunchType: FARGATE
      DesiredCount: !Ref TaskDesiredCount
      TaskDefinition: !Ref ContainerTaskDefinition
      HealthCheckGracePeriodSeconds: 60
      AvailabilityZoneRebalancing: ENABLED # Create defaults to ENABLED; updates of services that never set it treat it as DISABLED
      # Service-level CPUUtilization / MemoryUtilization at 20s instead of the default 60s
      Monitoring:
        MetricConfigurations:
          - MetricNames:
              - CPUUtilization
              - MemoryUtilization
            ResolutionSeconds: 20 # 20 | 60
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          SecurityGroups:
            - !Ref ContainerServiceSecurityGroup
          Subnets: !Ref VpcSubnetList
      DeploymentController:
        Type: ECS
      DeploymentConfiguration:
        Strategy: ROLLING
        MaximumPercent: 200       # Up to 2x desired tasks during the rollout
        MinimumHealthyPercent: 50 # Lower bound for EarlySuccessCriteria.HealthyPercent
        DeploymentCircuitBreaker: # Rolling-only
          Enable: true
          Rollback: true # Roll back to the last COMPLETED deployment on failure
          ResetOnHealthyTask: false # false = every task failure counts; true (default) = a healthy task resets the count
          ThresholdConfiguration:
            Type: COUNT # COUNT = Value is the failure count; BOUNDED_PERCENT (default, 50) / UNBOUNDED_PERCENT = Value x desired count
            Value: !Ref CircuitBreakerFailureCount
        EarlySuccessCriteria: # Rolling-only
          Enable: true
          HealthyPercent: !Ref EarlySuccessHealthyPercent # Rounded up: 75% of 4 = 3 healthy tasks
          SourceServiceRevisionCleanup: DEFERRED # Complete first, then stop old tasks in the background (BLOCKING = stop them before completing)
        BakeTimeInMinutes: !Ref DeploymentBakeTimeInMinutes # Only used with alarm-based rollback
        Alarms:
          Enable: true
          Rollback: true
          AlarmNames:
            - !Ref LoadBalancerTarget5xxAlarm
      LoadBalancers:
        - ContainerName: !Sub "${Application}-${Environment}-container"
          ContainerPort: !Ref ContainerPort
          TargetGroupArn: !Ref TargetGroup
      Tags:
        - Key: Name
          Value: !Sub "${Application}-${Environment}-containerservice"

  # ---------------------------------------------------------------
  # Rollback alarm
  # ---------------------------------------------------------------

  LoadBalancerTarget5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Target 5XX on the load balancer - triggers ECS deployment rollback
      Namespace: AWS/ApplicationELB
      MetricName: HTTPCode_Target_5XX_Count
      Dimensions:
        - Name: LoadBalancer
          Value: !GetAtt LoadBalancer.LoadBalancerFullName
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

# ---------------------------------------------------------------
# Outputs
# ---------------------------------------------------------------
Outputs:

  LoadBalancerUrl:
    Value: !Sub "http://${LoadBalancer.DNSName}/"

  ContainerClusterName:
    Value: !Ref ContainerCluster

  ContainerClusterArn:
    Value: !GetAtt ContainerCluster.Arn

  ContainerServiceArn:
    Value: !Ref ContainerService

  ContainerServiceName:
    Value: !GetAtt ContainerService.Name
